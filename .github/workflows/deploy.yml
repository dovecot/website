name: Deploy

on:
  push:
    branches:
      - main
      - develop

jobs:
  releasenew:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - name: Install Dependencies
      run: npm ci --no-fund --no-audit
    - name: Build dovecot.org with Sveltekit
      run: |
        npm run -w main build
    - name: Build pigeonhole with Sveltekit
      run: |
        npm run -w pigeonhole build
    - name: Deploy dovecot.org
      uses: dovecot/rsync-deployments@v2.0.3
      with:
        FLAGS: -azr --delete
        HOST: dovecot.org
        USER: website
        LOCALPATH: /main/build/.
        REMOTEPATH: public_html/main/${{ github.ref_name }}
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      if: env.DEPLOY_KEY
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    - name: Deploy pigeonhole.dovecot.org
      uses: dovecot/rsync-deployments@v2.0.3
      with:
        FLAGS: -azr --delete
        HOST: pigeonhole.dovecot.org
        USER: website
        LOCALPATH: /pigeonhole/build/.
        REMOTEPATH: public_html/pigeonhole/${{ github.ref_name }}
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      if: env.DEPLOY_KEY
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  releasenew:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - name: Install Dependencies
      run: npm ci --no-fund --no-audit
    - name: Build main with Sveltekit
      run: |
        npm run -w main build
    - name: Build pigeonhole with Sveltekit
      run: |
        npm run -w pigeonhole build
